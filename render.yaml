services:
  - type: web
    name: youtube-transcriber
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.10"
      - key: RATE_LIMIT_PER_MINUTE
        value: "20"
      - key: CACHE_TTL_SECONDS
        value: "300"
      - key: CACHE_MAX_SIZE
        value: "100"
      # Proxy secrets - set manually in Render dashboard
      - key: WEBSHARE_PROXY_USERNAME
        sync: false
      - key: WEBSHARE_PROXY_PASSWORD
        sync: false
      - key: WEBSHARE_PROXY_LOCATION
        sync: false
      - key: GENERIC_HTTP_PROXY
        sync: false
      - key: GENERIC_HTTPS_PROXY
        sync: false
